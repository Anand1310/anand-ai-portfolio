@if (profileLoading) {
  <app-loader></app-loader>
}

@if (profileLoadFailed) {
  <app-failure (reloadProfile)="loadProfile()"></app-failure>
}

@if (!profileLoading && !profileLoadFailed) {
  <app-header></app-header>
  <section id="about">
    <app-about 
      (openChat)="openChat()" 
      (openContact)="openContact()">
    </app-about>
  </section>

  <section id="experience">
    <app-experience></app-experience>
  </section>

  <section id="projects">
    <app-projects></app-projects>
  </section>

  <section id="achievements-certifications">
    <app-achievements-certification></app-achievements-certification>
  </section>

  <section id="skills">
    <app-skills></app-skills>
  </section>

  <app-footer></app-footer>

  <!-- Overlays -->
  <app-chat-overlay 
    *ngIf="showChat" 
    (close)="closeChat()">
  </app-chat-overlay>

  <app-contact-modal 
    *ngIf="showContact" 
    (close)="closeContact()">
  </app-contact-modal>
}
