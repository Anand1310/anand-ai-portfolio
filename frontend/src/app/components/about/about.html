<div class="about-container">
  <div class="left">
    <h1>{{about.name}}</h1>
    <h2>
      {{about.title}}
    </h2>
    <p>
      {{about.summary}}
    </p>
    <div class="buttons">
      <button class="primary" (click)="openChat.emit()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v8z"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Chat with my AI Assistant
      </button>
      <button class="secondary" (click)="openContact.emit()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M4 4h16v16H4z" stroke="currentColor" stroke-width="2"/>
          <path d="M22 6l-10 7L2 6" stroke="currentColor" stroke-width="2"/>
        </svg>
        Contact Me
      </button>
    </div>
  </div>
  <div class="right">
    <img src="assets/profile.jpeg" alt="" />
  </div>
</div>
